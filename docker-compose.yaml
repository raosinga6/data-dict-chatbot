version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dd_postgres
    environment:
      POSTGRES_DB: datadict
      POSTGRES_USER: dduser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql  # ← add this
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dduser -d datadict"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: dd_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dd_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dd_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dduser:${POSTGRES_PASSWORD}@postgres:5432/datadict
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dd_streamlit
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "8502:8501"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
  chroma_data: