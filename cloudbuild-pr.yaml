substitutions:
  _AR_HOST: asia-southeast1-docker.pkg.dev
  _REPO: data-dict-chatbot
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
timeout: 300s
steps:
  - name: python:3.12-slim
    id: run-tests
    entrypoint: bash
    args:
      - '-c'
      - |
          pip install uv
          uv pip install --system -r backend/requirements.txt
          cd backend
          pytest tests/ --tb=short -x -k "not (tables or columns or joins)"
    env:
      - DATABASE_URL=sqlite+aiosqlite:///./test.db
      - ENVIRONMENT=test
      - OPENAI_API_KEY=sk-test-fake
  - name: gcr.io/cloud-builders/docker
    id: build-image
    waitFor: [run-tests]
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=$_AR_HOST/$PROJECT_ID/$_REPO/app:pr-$SHORT_SHA
      - backend/

  # Build only — no push, no migration on PRs
  - name: gcr.io/cloud-builders/docker
    id: build-image
    waitFor: [run-tests]
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=$_AR_HOST/$PROJECT_ID/$_REPO/app:pr-$SHORT_SHA
      - backend/